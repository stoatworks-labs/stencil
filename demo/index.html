  <body>
    <main id="demo">
      <noscript>
        <h1>Stencil</h1>
        <p>
          An FFGL effect that cuts your clip into a stencil and sprays paint
          through it. A stencil can't hold a floating piece: cut out an O and
          its middle drops out. So every island in every layer gets the shortest
          bridge there is to another piece of sheet, found by a jump flood on
          the GPU and picked on the CPU, round and round until nothing floats.
          Then the holes are sprayed through a nozzle's footprint. The look
          comes out of that: the gap in the O where its ring is thinnest,
          islands inside islands hung off the frame, layers sprayed dark over
          light, a halo in proportion to Distance, ghostly bridges under a
          lifted sheet, and drips.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/stencil">its repository</a>.
        </p>
